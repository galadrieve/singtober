repos:
  - repo: builtin
    hooks:
      # File names
      - id: check-case-conflict # File formats
      - id: check-toml
          # Executables
          # Git shenanigans
      - id: check-merge-conflict
      - id: check-added-large-files
          # Python issues
          # Whitespace
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false

      - id: normalize
        name: normalize
        entry: uv run --no-active daily-writing normalize
        types: [markdown]
        language: python

      # The update-from-config hook isn't shipped in the template; it is added
      # by `update-from-config --init` so it can't run against a repo that init
      # hasn't configured yet.
      - id: update-from-config
        name: Update repo from configuration
        entry: .github/update-from-config
        files: ^(daily-writing\.toml|README\.md|USER_MANUAL\.md|LICENSE)$
        language: script
        pass_filenames: false
